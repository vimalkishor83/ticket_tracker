{% extends 'base.html' %}
{% block title %}Add Ticket – Ticket Tracker{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">
                <i class="bi bi-plus-circle me-2 text-primary"></i>Add New Ticket
            </h5>
            {% if frozen %}
            <span class="badge bg-danger fs-6">
                <i class="bi bi-snow me-1"></i>Freeze Active – Requires Approval
            </span>
            {% endif %}
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST" novalidate>
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="add-ticket-no">Ticket No <span class="text-danger">*</span></label>
                            <input type="text" name="ticket_no" id="add-ticket-no" class="form-control"
                                   value="{{ data.get('ticket_no', '') }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="add-ticket-ticket-type">Ticket Type</label>
                            <select name="ticket_type" class="form-select" id="add-ticket-ticket-type">
                                <option value="">-- Select --</option>
                                {% for t in ticket_types %}
                                <option value="{{ t }}" {% if data.get('ticket_type') == t %}selected{% endif %}>{{ t }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="add-ticket-service">Service</label>
                            <input type="text" name="service" class="form-control"
                                   value="{{ data.get('service', '') }}" id="add-ticket-service">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold" for="add-ticket-description">Description</label>
                            <textarea name="description" class="form-control" rows="2" id="add-ticket-description">{{ data.get('description', '') }}</textarea>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-status">Status</label>
                            <select name="status" class="form-select" id="add-ticket-status">
                                {% for s in statuses %}
                                <option value="{{ s }}" {% if (data.get('status') or 'Open') == s %}selected{% endif %}>{{ s }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-planned-month">Planned Month</label>
                            <select name="planned_month" class="form-select" id="add-ticket-planned-month">
                                <option value="">-- Select --</option>
                                {% for m in months %}
                                <option value="{{ m }}" {% if data.get('planned_month') == m %}selected{% endif %}>{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-actual-implementation-month">Actual Impl. Month</label>
                            <select name="actual_implementation_month" class="form-select" id="add-ticket-actual-implementation-month">
                                <option value="">-- Select --</option>
                                {% for m in months %}
                                <option value="{{ m }}" {% if data.get('actual_implementation_month') == m %}selected{% endif %}>{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-approved-by">Approved By</label>
                            <input type="text" name="approved_by" class="form-control"
                                   value="{{ data.get('approved_by', '') }}" id="add-ticket-approved-by">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-planned-efforts">Planned Efforts (hrs)</label>
                            <input type="number" name="planned_efforts" class="form-control" step="0.5" min="0"
                                   value="{{ data.get('planned_efforts', 0) }}" id="add-ticket-planned-efforts">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-utilized-efforts">Utilized Efforts (hrs)</label>
                            <input type="number" name="utilized_efforts" class="form-control" step="0.5" min="0"
                                   value="{{ data.get('utilized_efforts', 0) }}" id="add-ticket-utilized-efforts">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-estimated-uat">Estimated UAT</label>
                            <input type="date" name="estimated_uat" class="form-control"
                                   value="{{ data.get('estimated_uat', '') }}" id="add-ticket-estimated-uat">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-estimated-prod">Estimated Prod</label>
                            <input type="date" name="estimated_prod" class="form-control"
                                   value="{{ data.get('estimated_prod', '') }}" id="add-ticket-estimated-prod">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-actual-uat">Actual UAT</label>
                            <input type="date" name="actual_uat" class="form-control"
                                   value="{{ data.get('actual_uat', '') }}" id="add-ticket-actual-uat">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-actual-prod">Actual Prod</label>
                            <input type="date" name="actual_prod" class="form-control"
                                   value="{{ data.get('actual_prod', '') }}" id="add-ticket-actual-prod">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-revised-uat-date">Revised UAT Date</label>
                            <input type="date" name="revised_uat_date" class="form-control"
                                   value="{{ data.get('revised_uat_date', '') }}" id="add-ticket-revised-uat-date">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold" for="add-ticket-revised-prod-date">Revised Prod Date</label>
                            <input type="date" name="revised_prod_date" class="form-control"
                                   value="{{ data.get('revised_prod_date', '') }}" id="add-ticket-revised-prod-date">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="add-ticket-exception-from">Exception From</label>
                            <input type="text" name="exception_from" class="form-control"
                                   value="{{ data.get('exception_from', '') }}" id="add-ticket-exception-from">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="add-ticket-business-benefits">Business Benefits</label>
                            <input type="text" name="business_benefits" class="form-control"
                                   value="{{ data.get('business_benefits', '') }}" id="add-ticket-business-benefits">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold" for="add-ticket-remarks">Remarks</label>
                            <textarea name="remarks" class="form-control" rows="2" id="add-ticket-remarks">{{ data.get('remarks', '') }}</textarea>
                        </div>

                        <div class="col-12 d-flex gap-2 pt-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-{% if frozen %}hourglass-split{% else %}check-circle{% endif %} me-1"></i>
                                {% if frozen %}Submit for Approval{% else %}Save Ticket{% endif %}
                            </button>
                            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
