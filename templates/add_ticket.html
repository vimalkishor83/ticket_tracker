{% extends 'base.html' %}
{% block title %}Add Ticket – Ticket Tracker{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">
                <i class="bi bi-plus-circle me-2 text-primary"></i>Add New Ticket
            </h5>
            {% if frozen %}
            <span class="badge bg-danger fs-6">
                <i class="bi bi-snow me-1"></i>Freeze Active – Requires Approval
            </span>
            {% endif %}
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST" novalidate>
                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Ticket No <span class="text-danger">*</span></label>
                            <input type="text" name="ticket_no" class="form-control"
                                   value="{{ data.get('ticket_no', '') }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Ticket Type</label>
                            <select name="ticket_type" class="form-select">
                                <option value="">-- Select --</option>
                                {% for t in ticket_types %}
                                <option value="{{ t }}" {% if data.get('ticket_type') == t %}selected{% endif %}>{{ t }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Service</label>
                            <input type="text" name="service" class="form-control"
                                   value="{{ data.get('service', '') }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea name="description" class="form-control" rows="2">{{ data.get('description', '') }}</textarea>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Status</label>
                            <select name="status" class="form-select">
                                {% for s in statuses %}
                                <option value="{{ s }}" {% if (data.get('status') or 'Open') == s %}selected{% endif %}>{{ s }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Planned Month</label>
                            <select name="planned_month" class="form-select">
                                <option value="">-- Select --</option>
                                {% for m in months %}
                                <option value="{{ m }}" {% if data.get('planned_month') == m %}selected{% endif %}>{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Actual Impl. Month</label>
                            <select name="actual_implementation_month" class="form-select">
                                <option value="">-- Select --</option>
                                {% for m in months %}
                                <option value="{{ m }}" {% if data.get('actual_implementation_month') == m %}selected{% endif %}>{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Approved By</label>
                            <input type="text" name="approved_by" class="form-control"
                                   value="{{ data.get('approved_by', '') }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Assigned To</label>
                            <select name="assigned_to" class="form-select">
                                <option value="">Unassigned</option>
                                {% for u in active_users %}
                                <option value="{{ u.username }}"
                                    {% if data.get('assigned_to') == u.username %}selected{% endif %}>
                                    {{ u.username }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Planned Efforts (hrs)</label>
                            <input type="number" name="planned_efforts" class="form-control" step="0.5" min="0"
                                   value="{{ data.get('planned_efforts', 0) }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Utilized Efforts (hrs)</label>
                            <input type="number" name="utilized_efforts" class="form-control" step="0.5" min="0"
                                   value="{{ data.get('utilized_efforts', 0) }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Estimated UAT</label>
                            <input type="date" name="estimated_uat" class="form-control"
                                   value="{{ data.get('estimated_uat', '') }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Estimated Prod</label>
                            <input type="date" name="estimated_prod" class="form-control"
                                   value="{{ data.get('estimated_prod', '') }}">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Actual UAT</label>
                            <input type="date" name="actual_uat" class="form-control"
                                   value="{{ data.get('actual_uat', '') }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Actual Prod</label>
                            <input type="date" name="actual_prod" class="form-control"
                                   value="{{ data.get('actual_prod', '') }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Revised UAT Date</label>
                            <input type="date" name="revised_uat_date" class="form-control"
                                   value="{{ data.get('revised_uat_date', '') }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Revised Prod Date</label>
                            <input type="date" name="revised_prod_date" class="form-control"
                                   value="{{ data.get('revised_prod_date', '') }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Exception From</label>
                            <input type="text" name="exception_from" class="form-control"
                                   value="{{ data.get('exception_from', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Business Benefits</label>
                            <input type="text" name="business_benefits" class="form-control"
                                   value="{{ data.get('business_benefits', '') }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Remarks</label>
                            <textarea name="remarks" class="form-control" rows="2">{{ data.get('remarks', '') }}</textarea>
                        </div>

                        <div class="col-12 d-flex gap-2 pt-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-{% if frozen %}hourglass-split{% else %}check-circle{% endif %} me-1"></i>
                                {% if frozen %}Submit for Approval{% else %}Save Ticket{% endif %}
                            </button>
                            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
