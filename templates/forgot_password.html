{% extends 'base.html' %}
{% block title %}Forgot Password – Ticket Tracker{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 col-sm-10">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-envelope-open-fill text-primary" style="font-size:2.5rem;"></i>
                    <h4 class="fw-bold mt-2">Forgot Password</h4>
                    <p class="text-muted small">Enter your email to receive a reset link</p>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-send me-1"></i>Send Reset Link
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}" class="small text-decoration-none">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
