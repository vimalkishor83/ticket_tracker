{% extends 'base.html' %}
{% block title %}Register – Ticket Tracker{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 col-sm-10">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill text-primary" style="font-size:2.5rem;"></i>
                    <h4 class="fw-bold mt-2 mb-0">Create Account</h4>
                    <p class="text-muted small">A password setup link will be emailed to you</p>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold">
                        <i class="bi bi-envelope me-1"></i>Send Setup Link
                    </button>
                </form>
                <hr>
                <p class="text-center mb-0 small">
                    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
